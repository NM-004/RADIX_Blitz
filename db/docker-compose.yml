version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: radix_talent_db
    restart: always
    environment:
      POSTGRES_USER: radix_admin
      POSTGRES_PASSWORD: radix_secure_password123
      POSTGRES_DB: radix_talent_match
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
